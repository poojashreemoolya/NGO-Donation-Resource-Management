<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Distribution</title>
    <link rel="stylesheet" href="inventory.css">
</head>

<body>

<header>
    <h1>Resource Distribution</h1>
    <p>Manage resources distributed to beneficiaries</p>
</header>

<nav>
    <a href="resources.html">Dashboard</a>
    <a href="inventory.html">Inventory</a>
    <a href="distribution.html">Distribution</a>
</nav>

<main>

    <h2>Distribute Resources</h2>

    <form id="distributionForm">

        <label>Resource:</label>
        <select id="resourceId" required>
            <option value="">Select Resource</option>
        </select>

        <br><br>

        <label>Quantity:</label>
        <input type="number" id="quantity" min="1" required>

        <br><br>

        <label>Recipient Name:</label>
        <input type="text" id="recipientName" required>

        <br><br>

        <label>Distribution Date:</label>
        <input type="date" id="distributionDate" required>

        <br><br>

        <label>Notes:</label>
        <textarea id="notes"></textarea>

        <br><br>

        <button type="submit" class="btn">
            Distribute Resource
        </button>

    </form>

    <h2>Distribution Records</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Resource</th>
                <th>Quantity</th>
                <th>Recipient</th>
                <th>Date</th>
                <th>Notes</th>
            </tr>
        </thead>

        <tbody id="distributionTable"></tbody>
    </table>

</main>

<footer>
    <p>NGO Donation and Resource Management System</p>
</footer>

<script src="distribution.js"></script>

</body>
</html>
